name: iOS

on:
  push:
    branches: [main, feat/sprint2-ios]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test business decisions
        run: swift test --package-path Packages/UniEatCore
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: xcodebuild -project UniEat.xcodeproj -target UniEat -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
