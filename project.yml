name: UniEat
options:
  bundleIdPrefix: co.edu.uniandes
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
packages:
  UniEatCore:
    path: Packages/UniEatCore
targets:
  UniEat:
    type: application
    platform: iOS
    sources:
      - path: UniEatApp
    info:
      path: UniEatApp/Info.plist
      properties:
        CFBundleDisplayName: UniEat
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations:
          - es
        UIAppFonts:
          - Quicksand.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocationWhenInUseUsageDescription: "UniEat usa tu ubicación mientras usas la app para sugerir la zona y decirte qué tan lejos queda cada local. No se guarda ni se envía."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.edu.uniandes.unieat
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: UniEatCore
  UniEatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UniEatAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.edu.uniandes.unieat.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
    dependencies:
      - target: UniEat
schemes:
  UniEat:
    build:
      targets:
        UniEat: all
    run:
      config: Debug
      language: es
      region: CO
    test:
      targets:
        - UniEatTests
