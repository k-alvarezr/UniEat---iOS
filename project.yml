name: UniEat
options:
  bundleIdPrefix: co.edu.uniandes
  deploymentTarget:
    iOS: "17.0"
packages:
  UniEatCore:
    path: Packages/UniEatCore
targets:
  UniEat:
    type: application
    platform: iOS
    sources:
      - path: UniEatApp
    info:
      path: UniEatApp/Info.plist
      properties:
        CFBundleDisplayName: UniEat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.edu.uniandes.unieat
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: UniEatCore
